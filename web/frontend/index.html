<!doctype html>
<html lang="eng">
  <head>
    <meta charset="utf-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/favicon.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <title>K-means Compressor</title>
  </head>
  <body>
    <h1>K-means Compressor</h1>
    <form action="/compress/" method="post" enctype="multipart/form-data">
      <!-- without this enctype the browser can't carry binary files-->
      <label for="image">Upload your image:</label><br />
      <input
        type="file"
        id="image"
        name="file"
        required
        accept=".jpg$|.png$|.jpeg$"
      /><br />

      <label for="k">Pick number of k colors/clusters:</label><br />
      <input
        type="number"
        id="k"
        name="k"
        required
        min="1"
        max="256"
        value="8"
      /><br />

      <input type="submit" value="Submit" />
    </form>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
