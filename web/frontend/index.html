<!doctype html>
<html lang="eng">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <!-- Favicon -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="public/favicon_io/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="public/favicon_io/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="public/favicon_io/favicon-16x16.png"
    />
    <link rel="manifest" href="assets/favicon_io/site.webmanifest" />
    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Michroma&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Yrsa:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
    <title>K-means Compressor</title>
  </head>
  <body class="min-h-screen min-w-screen" id="grid-line">
    <div class="w-screen h-screen flex items-center justify-center">
      <!-- hero -->
      <div
        class="bg-[url(/hero.JPG)] bg-fixed bg-cover rounded-xl h-[95vh] w-[93%] flex items-end justify-start"
      >
        <!-- hero background -->
        <div class="grid gap-y-5 place-items-start p-10">
          <!-- hero h1, p, button-->
          <h1
            class="text-6xl font-bold text-(--snow) font-(family-name:--font-main)"
          >
            K-means Compressor
          </h1>
          <p class="text-xl text-(--snow) font-(family-name:--font-secondary)">
            Compressing jpg/png images using k-means clustering algorithm
            written from scratch.
          </p>
          <button
            class="text-xl w-auto border border-white hover:border-(--forest) text-(--snow) font-(family-name:--font-plain) p-2 cursor-pointer"
            onclick="
              document
                .getElementById('2nd-screen')
                .scrollIntoView({ behavior: 'smooth' })
            "
          >
            Let's get started!
          </button>
        </div>
        <!-- hero h1, p, button -->
      </div>
      <!-- hero background-->
    </div>
    <!-- hero -->
    <div
      id="2nd-screen"
      class="min-w-screen min-h-screen flex items-center justify-center"
    >
      <!-- 2nd screen with form -->
      <div class="min-w-auto min-h-auto py-10 px-4">
        <!-- box for form -->
        <div class="bg-white shadow-xl p-6">
          <!-- form -->
          <h2 class="text-2xl font-(family-name:--font-main) mb-4">Config</h2>
          <form
            class="space-y-4"
            action="/compress/"
            method="post"
            enctype="multipart/form-data"
          >
            <!-- without this enctype the browser can't carry binary files -->
            <div>
              <label
                for="image"
                class="block text-sm text-(--gunmetal) font-(family-name:--font-plain) mb-1"
                >Upload your image:</label
              >
              <input
                type="file"
                id="image"
                name="file"
                required
                accept=".jpg, .png, .jpeg"
                class="file:mr-4 file:bg-(--forest) file:px-4 file:py-2 file:text-lg file:font-(family-name:--font-secondary) file:text-(--snow) file:rounded hover:file:bg-(--meadow) hover:file:cursor-pointer"
              />
            </div>

            <div>
              <label
                for="k"
                class="block text-sm text-(--gunmetal) font-(family-name:--font-plain) mb-1"
                >k (number of colors/clusters):</label
              >
              <input
                type="number"
                id="k"
                name="k"
                required
                min="1"
                max="256"
                value="8"
                class="block w-full border border-(--pale-slate) p-2"
              />
            </div>

            <div>
              <label
                for="seed"
                class="block text-sm text-(--gunmetal) font-(family-name:--font-plain) mb-1"
                >Seed:</label
              >
              <input
                type="number"
                id="seed"
                name="seed"
                class="block w-full border border-(--pale-slate) p-2"
              />
            </div>

            <div>
              <label
                for="max_iter"
                class="block text-sm text-(--gunmetal) font-(family-name:--font-plain) mb-1"
                >Maximum number of iterations:</label
              >
              <input
                type="number"
                id="max_iter"
                name="max_iter"
                min="1"
                value="100"
                class="block w-full border border-(--pale-slate) p-2"
              />
            </div>

            <div>
              <label
                for="eps"
                class="block text-sm text-(--gunmetal) font-(family-name:--font-plain) mb-1"
                >Epsilon (convergence tolerance):</label
              >
              <input
                type="number"
                id="eps"
                name="eps"
                step="any"
                value="0.0001"
                class="block w-full border border-(--pale-slate) p-2"
              />
            </div>

            <div>
              <label
                for="batch_size"
                class="block text-sm text-(--gunmetal) font-(family-name:--font-plain) mb-1"
                >Batch size:</label
              >
              <input
                type="number"
                id="batch_size"
                name="batch_size"
                value="50000"
                class="block w-full border border-(--pale-slate) p-2"
              />
            </div>

            <div>
              <label for="backend" class="block text-sm text-(--gunmetal) mb-1"
                >Backend:</label
              >
              <span class="items-center inline-flex gap-1">
                <input
                  required
                  class="appearance-none w-4 h-4 rounded-full border border-(--pale-slate) checked:bg-(--forest) checked:border-(--meadow) hover:cursor-pointer"
                  type="radio"
                  id="scratch"
                  name="backend"
                  value="scratch"
                  checked
                />
                <label for="scratch" class="text-sm text-(--gunmetal)"
                  >Scratch</label
                >
              </span>

              <span class="items-center inline-flex gap-1">
                <input
                  class="appearance-none w-4 h-4 rounded-full border border-(--pale-slate) checked:bg-(--forest) checked:border-(--meadow) hover:cursor-pointer"
                  type="radio"
                  id="sklearn"
                  name="backend"
                  value="sklearn"
                />
                <label for="sklearn" class="text-sm text-(--gunmetal)"
                  >Scikit-learn</label
                >
              </span>

              <input
                type="submit"
                value="Compress..."
                class="w-full bg-(--forest) px-4 py-2 text-lg font-(family-name:--font-secondary) text-(--snow) rounded hover:bg-(--meadow) hover:cursor-pointer"
              />
            </div>
          </form>
        </div>
        <!-- form -->
      </div>
      <!-- box for form -->
    </div>
    <!-- 2nd screen with form -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
